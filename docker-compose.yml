services:
  tautweekly-manager:

    build:
      context: .

    image: tautweekly-manager:latest

    container_name: tautweekly-manager

    restart: unless-stopped

    ports:
      - "8788:8000"

    volumes:
      - /mnt/user/docker/TautWeekly:/tautweekly
      - /mnt/user/docker/TautWeekly/data:/tautweekly/data:rw
      - /var/run/docker.sock:/var/run/docker.sock
